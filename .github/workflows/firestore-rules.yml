name: Deploy Firestore account rules
on:
  push:
    branches: [main]
    paths: [firestore.rules, scripts/deploy-firestore-rules.mjs, .github/workflows/firestore-rules.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/deploy-firestore-rules.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
