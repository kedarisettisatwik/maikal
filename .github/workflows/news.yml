name: Update morning news

on:
  schedule:
    # GitHub cron is UTC: 00:30 UTC = 06:00 Asia/Kolkata every day.
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Fetch and validate feeds without writing to Firebase
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: morning-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Fetch news and update Firebase
        run: npm run news:sync
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          NEWS_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
